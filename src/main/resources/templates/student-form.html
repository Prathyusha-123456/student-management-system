<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Student Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container"><span class="navbar-brand">Student Management System</span></div>
</nav>
<div class="container" style="max-width: 640px;">
  <h4 th:text="${student.id == null} ? 'Add Student' : 'Edit Student'"></h4>
  <form th:action="@{/students/save}" th:object="${student}" method="post" class="card card-body">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label class="form-label">First name</label>
      <input class="form-control" th:field="*{firstName}">
      <div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Last name</label>
      <input class="form-control" th:field="*{lastName}">
      <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input class="form-control" th:field="*{email}">
      <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Roll number</label>
      <input class="form-control" th:field="*{rollNumber}">
      <div class="text-danger small" th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Date of birth</label>
      <input type="date" class="form-control" th:field="*{dateOfBirth}">
      <div class="text-danger small" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Course</label>
      <select class="form-select" name="courseId">
        <option value="">-- Select --</option>
        <option th:each="c : ${courses}" th:value="${c.id}"
                th:text="${c.code + ' - ' + c.name}"
                th:selected="${courseId != null and courseId == c.id}"></option>
      </select>
    </div>

    <div>
      <button class="btn btn-primary">Save</button>
      <a class="btn btn-secondary" th:href="@{/students}">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
