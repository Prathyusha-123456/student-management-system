<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Student Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container"><span class="navbar-brand">Student Management System</span></div>
</nav>
<div class="container">
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

  <div class="d-flex justify-content-between mb-3">
    <form class="d-flex" th:action="@{/students}" method="get">
      <input class="form-control me-2" name="keyword" th:value="${keyword}" placeholder="Search name, email, roll no.">
      <button class="btn btn-outline-primary">Search</button>
    </form>
    <a class="btn btn-primary" th:href="@{/students/new}">+ Add Student</a>
  </div>

  <table class="table table-bordered table-hover bg-white">
    <thead class="table-dark">
      <tr><th>ID</th><th>Roll No.</th><th>Name</th><th>Email</th><th>DOB</th><th>Course</th><th>Actions</th></tr>
    </thead>
    <tbody>
      <tr th:each="s : ${students}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.rollNumber}"></td>
        <td th:text="${s.firstName + ' ' + s.lastName}"></td>
        <td th:text="${s.email}"></td>
        <td th:text="${s.dateOfBirth}"></td>
        <td th:text="${s.course != null ? s.course.code : '-'}"></td>
        <td>
          <a class="btn btn-sm btn-warning" th:href="@{/students/{id}/edit(id=${s.id})}">Edit</a>
          <form class="d-inline" th:action="@{/students/{id}/delete(id=${s.id})}" method="post"
                onsubmit="return confirm('Delete this student?');">
            <button class="btn btn-sm btn-danger">Delete</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(students)}"><td colspan="7" class="text-center">No students found</td></tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-between align-items-center">
    <span>Total: <b th:text="${totalItems}"></b></span>
    <nav th:if="${totalPages > 1}">
      <ul class="pagination mb-0">
        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
          <a class="page-link" th:href="@{/students(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
        </li>
      </ul>
    </nav>
  </div>
</div>
</body>
</html>
